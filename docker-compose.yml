services:

  postgres:
    image: postgres:16
    container_name: etl_postgres
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: etl_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  airflow:
    build: ./airflow
    container_name: etl_airflow
    depends_on:
      - airflow-postgres
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    ports:
      - "8081:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./generator:/opt/airflow/generator
    command: standalone

  airflow-postgres:
    image: postgres:16
    container_name: airflow_postgres
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: etl_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  generator:
    build: ./generator
    container_name: etl_generator
    depends_on:
      - postgres
  superset-db:
    image: postgres:16
    container_name: etl_superset_db
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset_password
    volumes:
      - superset_db_data:/var/lib/postgresql/data

  superset:
    build: ./superset
    container_name: etl_superset
    depends_on:
      - superset-db
      - clickhouse
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "change-me-for-local-project"
      DATABASE_DB: superset
      DATABASE_HOST: superset-db
      DATABASE_PASSWORD: superset_password
      DATABASE_USER: superset
      DATABASE_PORT: 5432
    command: >
      /bin/sh -c "
      superset db upgrade &&
      superset fab create-admin
      --username admin
      --firstname Admin
      --lastname Admin
      --email admin@example.com
      --password admin || true &&
      superset init &&
      gunicorn
      --bind 0.0.0.0:8088
      --workers 2
      --timeout 120
      'superset.app:create_app()'
      "

volumes:
  postgres_data:
  clickhouse_data:
  airflow_postgres_data:
  superset_db_data: